<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <title>{{ sitename }}</title>
</head>

<body class="d-flex flex-column min-vh-100">

    <header class="container p-2">
        <div class="p-4 bg-primary text-white rounded">
            <a href="{{ url_for('index') }}">
                <h1 class="text-light"><span class="text-warning">&#9982;</span> {{ sitename }}</h1>
            </a>
        </div>
    </header>

    <nav class="container px-2">
        <div class="navbar navbar-expand-sm navbar-dark bg-dark rounded">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="mynavbar">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('index') }}">Início</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="javascript:void(0)">Contatos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('about') }}">Sobre</a>
                        </li>
                    </ul>
                    <form class="d-flex" method="get">
                        <div class="input-group">
                        <input class="form-control" type="text" placeholder="Procurar">
                        <button class="btn btn-light px-2" type="submit">🔎</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <main class="container pt-2 px-2 flex-grow-1 d-flex">
        <div class="bg-body rounded p-3 flex-grow-1">
            {% block content %}
            {% endblock %}
        </div>
    </main>


    <footer class="container mt-2 mb-2 px-2 ">
        <div class="bg-dark text-light p-3 rounded text-center">&copy; 2026 {{ sitename }}</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
</html>
